# PROFIL DE PRODUCTION (MySQL Database)
# Pour activer: mvn spring-boot:run -Dspring-boot.run.profiles=prod

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://db:3306/formationdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootpassword

# H2 Console (disabled in production)
spring.h2.console.enabled=false

# JPA Properties for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false

# Logging (Production mode - less verbose)
logging.level.spring.jpa.centre_formation=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Server
server.port=8080

# Check Server health 
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Email (Mock - for testing without real SMTP)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
