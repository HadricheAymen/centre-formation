# PROFIL DE DEVELOPPEMENT (H2 Database)
# Pour activer: mvn spring-boot:run -Dspring-boot.run.profiles=dev

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:formationdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA Properties for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Logging (Debug mode for development)
logging.level.spring.jpa.centre_formation=false
logging.level.org.hibernate.SQL=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=false
logging.level.org.springframework.security=false

# Server
server.port=8080

# Check Server health 
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Email (Mock - Development)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false


# Disable Hibernate parameter binding logs
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Disable Hibernate statistics
logging.level.org.hibernate.stat=OFF
