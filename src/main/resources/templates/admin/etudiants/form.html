<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${etudiant.id != null ? 'Modifier Étudiant' : 'Nouvel Étudiant'}">Formulaire Étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> Centre de Formation
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-user-graduate"></i>
                            <span th:text="${etudiant.id != null ? 'Modifier Étudiant' : 'Nouvel Étudiant'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${etudiant.id != null ? '/admin/etudiants/' + etudiant.id : '/admin/etudiants'}" 
                              th:object="${etudiant}" method="post">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="matricule" class="form-label">
                                        <i class="fas fa-id-card"></i> Matricule *
                                    </label>
                                    <input type="text" class="form-control" id="matricule" 
                                           th:field="*{matricule}" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope"></i> Email *
                                    </label>
                                    <input type="email" class="form-control" id="email" 
                                           th:field="*{email}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nom" class="form-label">
                                        <i class="fas fa-user"></i> Nom *
                                    </label>
                                    <input type="text" class="form-control" id="nom" 
                                           th:field="*{nom}" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="prenom" class="form-label">
                                        <i class="fas fa-user"></i> Prénom *
                                    </label>
                                    <input type="text" class="form-control" id="prenom" 
                                           th:field="*{prenom}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock"></i> Mot de passe
                                        <span th:if="${etudiant.id == null}">*</span>
                                    </label>
                                    <input type="password" class="form-control" id="password" 
                                           th:field="*{password}" 
                                           th:required="${etudiant.id == null}">
                                    <small class="form-text text-muted" th:if="${etudiant.id != null}">
                                        Laissez vide pour conserver le mot de passe actuel
                                    </small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="dateInscription" class="form-label">
                                        <i class="fas fa-calendar"></i> Date d'inscription *
                                    </label>
                                    <input type="date" class="form-control" id="dateInscription" 
                                           th:field="*{dateInscription}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="adresse" class="form-label">
                                    <i class="fas fa-map-marker-alt"></i> Adresse
                                </label>
                                <textarea class="form-control" id="adresse" rows="2" 
                                          th:field="*{adresse}"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="telephone" class="form-label">
                                        <i class="fas fa-phone"></i> Téléphone
                                    </label>
                                    <input type="tel" class="form-control" id="telephone" 
                                           th:field="*{telephone}">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <div class="form-check mt-4">
                                        <input type="checkbox" class="form-check-input" id="active" 
                                               th:field="*{active}">
                                        <label class="form-check-label" for="active">
                                            <i class="fas fa-check-circle"></i> Compte actif
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a href="/admin/etudiants" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
