<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${formateur.id != null ? 'Modifier Formateur' : 'Nouveau Formateur'}">Formulaire Formateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> Centre de Formation
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-chalkboard-teacher"></i>
                            <span th:text="${formateur.id != null ? 'Modifier Formateur' : 'Nouveau Formateur'}"></span>
                        </h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${formateur.id != null ? '/admin/formateurs/' + formateur.id : '/admin/formateurs'}" 
                              th:object="${formateur}" method="post">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nom" class="form-label">
                                        <i class="fas fa-user"></i> Nom *
                                    </label>
                                    <input type="text" class="form-control" id="nom" 
                                           th:field="*{nom}" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="prenom" class="form-label">
                                        <i class="fas fa-user"></i> Prénom *
                                    </label>
                                    <input type="text" class="form-control" id="prenom" 
                                           th:field="*{prenom}" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label">
                                        <i class="fas fa-envelope"></i> Email *
                                    </label>
                                    <input type="email" class="form-control" id="email" 
                                           th:field="*{email}" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="telephone" class="form-label">
                                        <i class="fas fa-phone"></i> Téléphone
                                    </label>
                                    <input type="tel" class="form-control" id="telephone" 
                                           th:field="*{telephone}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">
                                        <i class="fas fa-lock"></i> Mot de passe
                                        <span th:if="${formateur.id == null}">*</span>
                                    </label>
                                    <input type="password" class="form-control" id="password" 
                                           th:field="*{password}" 
                                           th:required="${formateur.id == null}">
                                    <small class="form-text text-muted" th:if="${formateur.id != null}">
                                        Laissez vide pour conserver le mot de passe actuel
                                    </small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="specialite" class="form-label">
                                        <i class="fas fa-tag"></i> Spécialité
                                    </label>
                                    <select class="form-select" id="specialite" th:field="*{specialite}">
                                        <option value="">-- Sélectionner une spécialité --</option>
                                        <option th:each="s : ${specialites}" 
                                                th:value="${s.id}" 
                                                th:text="${s.code + ' - ' + s.nom}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="biographie" class="form-label">
                                    <i class="fas fa-info-circle"></i> Biographie
                                </label>
                                <textarea class="form-control" id="biographie" rows="3" 
                                          th:field="*{biographie}" 
                                          placeholder="Décrivez l'expérience et les compétences du formateur..."></textarea>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="active" 
                                           th:field="*{active}">
                                    <label class="form-check-label" for="active">
                                        <i class="fas fa-check-circle"></i> Compte actif
                                    </label>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a href="/admin/formateurs" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
