<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Séance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> Centre de Formation
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/etudiants">
                            <i class="fas fa-users"></i> Étudiants
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="coursDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-book"></i> Cours
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="coursDropdown">
                            <li><a class="dropdown-item" href="/admin/cours">
                                <i class="fas fa-list"></i> Liste des Cours
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/admin/inscriptions">
                                <i class="fas fa-clipboard-check"></i> Inscriptions
                            </a></li>
                            <li><a class="dropdown-item active" href="/admin/seances">
                                <i class="fas fa-calendar"></i> Emploi du Temps
                            </a></li>
                            <li><a class="dropdown-item" href="/admin/statistiques">
                                <i class="fas fa-chart-pie"></i> Statistiques
                            </a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/notes">
                            <i class="fas fa-star"></i> Notes
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0"><i class="fas fa-calendar-alt"></i> Planifier une Séance</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${seance.id != null ? '/admin/seances/' + seance.id : '/admin/seances'}" 
                              th:object="${seance}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-book"></i> Cours *</label>
                                <select class="form-select" th:field="*{cours}" required>
                                    <option value="">Sélectionnez un cours</option>
                                    <option th:each="cours : ${cours}" 
                                            th:value="${cours.id}"
                                            th:text="${cours.code + ' - ' + cours.titre}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-door-open"></i> Salle *</label>
                                <input type="text" class="form-control" th:field="*{salle}"
                                       placeholder="Ex: A101" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-calendar-alt"></i> Date et Heure Début *</label>
                                    <input type="datetime-local" class="form-control" th:field="*{dateDebut}" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-calendar-alt"></i> Date et Heure Fin *</label>
                                    <input type="datetime-local" class="form-control" th:field="*{dateFin}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-tag"></i> Type de Séance *</label>
                                <select class="form-select" th:field="*{type}" required>
                                    <option value="">Sélectionnez</option>
                                    <option value="Cours">Cours</option>
                                    <option value="TD">TD</option>
                                    <option value="TP">TP</option>
                                    <option value="Examen">Examen</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-comment"></i> Description</label>
                                <textarea class="form-control" th:field="*{description}" rows="3"
                                          placeholder="Description de la séance (optionnel)"></textarea>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a href="/admin/seances" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
