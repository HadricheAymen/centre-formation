<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-graduation-cap"></i> Centre de Formation</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-warning text-white">
                        <h4 class="mb-0"><i class="fas fa-star"></i> Saisie de Note</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="${note.id != null ? '/admin/notes/' + note.id : '/admin/notes'}" 
                              th:object="${note}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user-graduate"></i> Étudiant *</label>
                                <select class="form-select" th:field="*{etudiant}" required>
                                    <option value="">Sélectionnez un étudiant</option>
                                    <option th:each="etudiant : ${etudiants}" 
                                            th:value="${etudiant.id}"
                                            th:text="${etudiant.matricule + ' - ' + etudiant.nom + ' ' + etudiant.prenom}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-book"></i> Cours *</label>
                                <select class="form-select" th:field="*{cours}" required>
                                    <option value="">Sélectionnez un cours</option>
                                    <option th:each="cours : ${cours}" 
                                            th:value="${cours.id}"
                                            th:text="${cours.code + ' - ' + cours.titre}">
                                    </option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-star"></i> Note (sur 20) *</label>
                                    <input type="number" class="form-control" th:field="*{valeur}" 
                                           min="0" max="20" step="0.5" required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label"><i class="fas fa-clipboard"></i> Type d'évaluation *</label>
                                    <select class="form-select" th:field="*{typeEvaluation}" required>
                                        <option value="">Sélectionnez</option>
                                        <option value="Examen">Examen</option>
                                        <option value="TP">TP</option>
                                        <option value="Projet">Projet</option>
                                        <option value="CC">Contrôle Continu</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-comment"></i> Commentaire</label>
                                <textarea class="form-control" th:field="*{commentaire}" rows="3"></textarea>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-between">
                                <a href="/admin/notes" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-warning">
                                    <i class="fas fa-save"></i> Enregistrer
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
