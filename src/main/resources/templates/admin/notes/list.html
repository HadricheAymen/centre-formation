<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-graduation-cap"></i> Centre de Formation
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/dashboard">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/etudiants">
                            <i class="fas fa-users"></i> Étudiants
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="coursDropdown" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-book"></i> Cours
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="coursDropdown">
                            <li><a class="dropdown-item" href="/admin/cours">
                                <i class="fas fa-list"></i> Liste des Cours
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="/admin/inscriptions">
                                <i class="fas fa-clipboard-check"></i> Inscriptions
                            </a></li>
                            <li><a class="dropdown-item" href="/admin/seances">
                                <i class="fas fa-calendar"></i> Emploi du Temps
                            </a></li>
                            <li><a class="dropdown-item" href="/admin/statistiques">
                                <i class="fas fa-chart-pie"></i> Statistiques
                            </a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/admin/notes">
                            <i class="fas fa-star"></i> Notes
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-light btn-sm">
                                <i class="fas fa-sign-out-alt"></i> Déconnexion
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-star"></i> Gestion des Notes</h2>
            <a href="/admin/notes/new" class="btn btn-warning">
                <i class="fas fa-plus"></i> Nouvelle Note
            </a>
        </div>

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Étudiant</th>
                            <th>Cours</th>
                            <th>Note</th>
                            <th>Type</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="note : ${notes}">
                            <td th:text="${note.etudiant.nom + ' ' + note.etudiant.prenom}"></td>
                            <td th:text="${note.cours.titre}"></td>
                            <td><span class="badge bg-primary" th:text="${note.valeur + '/20'}"></span></td>
                            <td th:text="${note.typeEvaluation}"></td>
                            <td th:text="${note.dateEvaluation != null ? #temporals.format(note.dateEvaluation, 'dd/MM/yyyy') : '-'}"></td>
                            <td>
                                <a th:href="@{/admin/notes/{id}/edit(id=${note.id})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/admin/notes/{id}/delete(id=${note.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('Supprimer cette note ?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a href="/" class="btn btn-secondary"><i class="fas fa-home"></i> Retour</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
