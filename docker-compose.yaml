services:
  db:
    image: mysql:8.0
    container_name: formation_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: centre_formation
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backups:/backups
    networks:
      - formation-network
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped

  app:
    build: .
    image: centre-formation-app:latest
    container_name: formation_app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/centre_formation
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - formation-network
    volumes:
      - ./backups:/app/backups
    restart: unless-stopped

volumes:
  db_data:

networks:
  formation-network:
    driver: bridge
